services:
  - type: web
    name: recipe-organizer-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start --workspace=server
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
